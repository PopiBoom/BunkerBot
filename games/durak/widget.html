<style>
:root{--a:var(--tg-theme-button-color);--h:var(--tg-theme-hint-color)}
body{margin:0;padding:6px 4px 8px}
#op{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 10px;margin-bottom:8px}
.o{display:flex;flex-direction:column;align-items:center;width:64px;font:600 12px system-ui}
.o u{position:relative;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 16px system-ui;text-decoration:none}
.A u{box-shadow:0 0 0 3px #f5b83d}.D u{box-shadow:0 0 0 3px #ef5350}
.o s{position:absolute;right:-10px;bottom:-5px;font-size:15px;text-decoration:none}
.o b{max-width:64px;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.o i{position:relative;display:flex;justify-content:center;height:24px;margin-top:5px}
.o i b{flex:none;width:15px;height:21px;margin-left:-9px;box-sizing:border-box;border-radius:3px;border:1.5px solid #fff;background:repeating-linear-gradient(45deg,#b71c1c 0 2px,#d84040 2px 4px);box-shadow:0 1px 2px #0006;transform-origin:50% 120%}
.o i b:first-child{margin-left:0}
.o i em{position:absolute;right:2px;top:-6px;min-width:18px;height:18px;padding:0 4px;box-sizing:border-box;border-radius:9px;background:#fff;color:#b71c1c;border:1px solid #0003;box-shadow:0 1px 2px #0005;font:normal 800 12px/16px system-ui;text-align:center}
#tb{position:relative;display:flex;align-items:center;gap:6px;min-height:178px;padding:12px 8px;border:6px solid #6b4423;border-radius:24px;background:radial-gradient(#3a9a63,#1c5a3a 78%);color:#fff;box-shadow:0 3px 0 #3d2614}
#dk,#ds{position:relative;flex:none;width:62px;height:86px}
#ds{width:46px}
.c{position:relative;display:inline-block;box-sizing:border-box;width:42px;height:60px;padding:3px 0 0 4px;border-radius:6px;background:#fff;color:#1b1b1b;border:1px solid #0005;box-shadow:0 2px 0 #0003;font:800 15px/1 system-ui;text-align:left;vertical-align:top}
.c small{display:block;font-size:12px}
.c i{position:absolute;left:0;right:0;bottom:5px;text-align:center;font:normal 24px/1 system-ui}
.r{color:#d32f2f}
.k{background:repeating-linear-gradient(45deg,#b71c1c 0 3px,#d84040 3px 6px);border:3px solid #fff}
#dk .c,#ds .c{position:absolute;left:0;top:4px}
#dk .t{left:24px;top:16px;transform:rotate(90deg)}
#dk .k+.k{left:3px;top:1px}
#ds .c{transform:rotate(12deg)}#ds .c+.c{transform:rotate(-9deg)}
#tb em{position:absolute;left:0;right:0;bottom:-4px;text-align:center;font:normal 800 13px system-ui}
#dk em{right:18px}
#pr{flex:1;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:4px 6px;min-width:0}
.p{position:relative;width:60px;height:80px}
.p .c+.c{position:absolute;left:17px;top:19px;transform:rotate(8deg)}
.g .c{box-shadow:0 0 0 3px #ffd54a}
.lb{font:800 16px system-ui;text-align:center}
.ev{padding:8px 16px;border-radius:14px;background:#0000008c;font:800 19px system-ui;white-space:nowrap}
.tr{position:absolute;left:-5px;top:-5px;width:46px;height:46px;transform:rotate(-90deg)}.tr circle{fill:none;stroke:var(--a);stroke-width:3;stroke-dasharray:100}@keyframes tm{to{stroke-dashoffset:100}}
#tq{height:4px;margin:6px 12px 0}#tq i{display:block;height:4px;border-radius:2px;background:var(--a);transform-origin:0 0}@keyframes tq{to{transform:scaleX(0)}}
.bu{padding:1px 7px;border-radius:8px;background:#f5b83d;color:#111;font-weight:800;text-transform:uppercase}
#ft{display:flex;align-items:center;gap:6px;margin:10px 2px 0}
#st{flex:1;min-width:0;font:700 14px system-ui}#st.y{color:var(--a)}#st.e{color:#e0533f}
button{padding:10px 18px;border-radius:12px;font:800 14px system-ui;color:#fff}
#bb{background:#2e9e5b}#bt{background:#e0533f}.ac{background:var(--a);color:var(--tg-theme-button-text-color)}
#hd{display:flex;justify-content:center;height:100px;padding-top:16px}#hd:empty{display:none}
#hd .c{flex:none;width:50px;height:72px;font-size:17px;transform-origin:50% 140%;transform:translateY(var(--y)) rotate(var(--r))}
#hd .s{transform:translateY(calc(var(--y) - 16px)) rotate(var(--r));box-shadow:0 0 0 3px var(--a)}
#hd .n{background:#cbcbcb;color:#888}
.x0{display:none!important}
</style>
<div id="op"></div>
<div id="tb"><div id="dk"></div><div id="pr"></div><div id="ds"></div></div>
<div id="tq"></div>
<div id="ft"><span id="st"></span><button id="bt">Беру</button><button id="bb"></button><button id="bs" class="ac"></button></div>
<div id="hd"></div>
<script>
const T=window.TelegramWidget||0,$=i=>document.getElementById(i),SU={s:'♠',h:'♥',d:'♦',c:'♣'},V='\ufe0e',RK='6789TJQKA',
J=s=>{try{return JSON.parse(s)||{}}catch(e){return{}}},
es=s=>(s+'').replace(/</g,'&lt;'),
cd=(c,k='',y='',u=SU[c[1]]+V)=>`<b class="c${'hd'.includes(c[1])?' r':''}${k}" style="${y}">${c[0]=='T'?10:c[0]}<small>${u}</small><i>${u}</i></b>`,
bk='<b class="c k"></b>',
H=()=>(S.h||'').match(/../g)||[],P=()=>((S.t||'').match(/..../g)||[]).map(p=>[p.slice(0,2),p[2]=='-'?0:p.slice(2)]),
bt=(c,a)=>c[1]==a[1]&&RK.indexOf(c[0])>RK.indexOf(a[0])||S.k&&c[1]==S.k[1]&&a[1]!=S.k[1];
let S,rt,qg,qt,sel=-1,busy=0,tm,fm='';
function up(s){S=s;rt=Date.now();if(S.q&&S.q!=qg){clearTimeout(qt);qt=setTimeout(()=>{qg=S.q;draw()},3e3)}}
up(J(T.chatData));
function ok(c){let p=P(),r=S.r;if(S.p!='g')return 0;
if(r=='d')return!S.tk&&(p.some(x=>!x[1]&&bt(c,x[0]))||S.v&&c[0]==p[0][0][0]);
if(r!='a'&&r!='w')return 0;if(!p.length)return r=='a';
return S.m>0&&p.some(x=>x.join('').includes(c[0]))}
function dim(c){let p=P();return S.p=='g'&&!ok(c)&&(S.r=='d'?!S.tk&&p.some(x=>!x[1]):S.r=='a'||S.r=='w'&&p.length)}
function toast(m){fm=m;clearTimeout(tm);tm=setTimeout(()=>{fm='';draw()},2400);draw()}
function draw(){let s=S,p=P(),h=H(),n=h.length,k,all=p.length&&!p.some(q=>!q[1]),g=s.p=='g',
bb=g&&(s.r=='a'||s.r=='w')&&p.length&&(all||s.tk)&&!s.ps,bt2=g&&s.r=='d'&&!s.tk&&p.length&&!all,st=n>1?Math.min(38,230/(n-1)):0,
L=s.w?Math.max(0,s.w[0]-(Date.now()-rt)/1e3):0,F=s.w?L/s.w[1]:0;
$('op').innerHTML=(s.o||[]).map((o,j)=>{let f=o[2],c=(f.match(/[adx]/)||[''])[0];return`<div class="o ${c.toUpperCase()}"><u style=background:hsl(${j*61},58%,48%)>${es(o[0][0])}<s>${{a:'⚔️',d:'🛡',x:'🏁'}[c]||(/p/.test(f)?'✓':'')}</s>${/t/.test(f)?`<svg class=tr viewBox="0 0 40 40"><circle cx=20 cy=20 r=18 pathLength=100 style="stroke-dashoffset:${100-F*100};animation:tm ${L}s linear forwards"/></svg>`:''}</u><b>${o[3]&&s.q!=qg?`<span class=bu>${o[3]}</span>`:es(o[0])}</b>`+(s.p=='l'?'':`<i>${Array.from({length:Math.min(o[1],6)},(_,i,a)=>`<b style=transform:rotate(${(i-(Math.min(o[1],6)-1)/2)*8}deg)></b>`).join('')}${o[1]?`<em>${o[1]}</em>`:''}</i>`)+'</div>'}).join('');
if(s.p=='l'){$('dk').innerHTML=$('ds').innerHTML='';$('pr').innerHTML=`<div class=lb>За столом ${(s.o||[]).length} из 6</div>`}
else{$('dk').innerHTML=s.d?cd(s.k,' t')+(s.d>1?bk+bk:'')+`<em>${s.d}</em>`:s.k?`<em>${SU[s.k[1]]+V}</em>`:'';
$('ds').innerHTML=s.b?bk+bk+'<em>бито</em>':'';
$('pr').innerHTML=p.length?p.map((q,i)=>`<span class="p${sel>=0&&s.r=='d'&&!q[1]&&bt(h[sel],q[0])?' g':''}">${cd(q[0])+(q[1]?cd(q[1]):'')}</span>`).join(''):s.p=='e'?`<div class=ev>${{w:'🎉',l:'🤡',d:'🤝'}[s.x]||'🃏'} ${es(s.s)}</div>`:g&&s.lv?`<div class=ev>${s.lv[0]=='b'?'✓ БИТО':es(s.lv[1])+' берёт +'+s.lv[2]}</div>`:''}
$('tq').innerHTML=s.tw?`<i style="transform:scaleX(${F});animation:tq ${L}s linear forwards"></i>`:'';
$('hd').innerHTML=h.map((c,i)=>{let a=(i-(n-1)/2)*Math.min(5,30/n);return cd(c,(i==sel?' s':'')+(dim(c)?' n':''),`--r:${a}deg;--y:${a*a/6}px;margin-left:${i?st-50:0}px`)}).join('');
k=$('st');k.textContent=busy?'…':fm||s.s||'';k.className=fm?'e':bb||bt2||g&&s.r=='a'&&!p.length?'y':'';
k=$('bb');k.className=bb?'':'x0';k.textContent=s.tk?'Пас':'Бито';
$('bt').className=bt2?'':'x0';
k=$('bs');k.className=s.p!='g'&&s.H?'ac':'x0';k.textContent=s.p=='e'?'🔁 Ещё раз':'▶️ Начать'}
function send(a,x){if(busy)return;let r;try{r=T.request(a+':'+S.g+(x?':'+x:''))}catch(e){r=Promise.reject(e)}
busy=1;sel=-1;draw();
r.then(a=>{let j=J(a&&a.result);if(j.err)throw{code:j.err};if(j.s)up(j.s);busy=0;draw()}).catch(e=>{busy=0;draw();toast(/^[A-Z_]*$/.test(e.code||'')?'Нет связи с ботом':e.code)})}
$('hd').onclick=e=>{let c=e.target.closest('.c');if(!c||!T||busy)return;let i=[...$('hd').children].indexOf(c),q=H()[i];
if(!ok(q))return toast(dim(q)?'Так нельзя':'Не твой ход');
if(sel!=i){sel=i;return draw()}
if(S.r!='d')return send('ua',q);
if(S.v&&q[0]==P()[0][0][0])return send('uv',q);
let t=P().map((x,j)=>!x[1]&&bt(q,x[0])?j:-1).filter(j=>j>=0);
t.length>1?toast('Нажми, какую кроешь'):send('ud',q+t[0])};
$('pr').onclick=e=>{let c=e.target.closest('.p');if(!c||sel<0||S.r!='d'||busy)return;let j=[...$('pr').children].indexOf(c),q=H()[sel],x=P()[j];
x&&!x[1]&&bt(q,x[0])?send('ud',q+j):toast('Не бьёт')};
$('bb').onclick=()=>send('ub');$('bt').onclick=()=>send('ut');$('bs').onclick=()=>send(S.p=='e'?'un':'us');
T&&T.onEvent('chatDataChanged',()=>{up(J(T.chatData));sel=-1;fm='';draw()});
draw();T.ready&&T.ready();
</script>
