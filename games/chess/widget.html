<!-- Шахматы Пиздюка: доска-виджет в личке у бота (games/chess/widget.py). Состояние — chatData (JSON от бота), ход — запрос m:<партия>:<с><на> -->
<style>
body{margin:0;padding:10px 10px 12px;font:15px system-ui;color:var(--tg-theme-text-color);-webkit-user-select:none;user-select:none}
#h,#ft{display:flex;align-items:center;gap:8px;min-height:24px}
#h b,#st{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#n{color:var(--tg-theme-hint-color);font-size:13px}
#bd{display:grid;grid-template-columns:repeat(8,1fr);max-width:420px;margin:8px auto;border-radius:6px;overflow:hidden}
#bd i{position:relative;display:grid;place-items:center;aspect-ratio:1;line-height:1;font-style:normal}
#bd i>*{grid-area:1/1;font-weight:400;text-decoration:none;position:relative;z-index:1}
#bd u{color:#fff}#bd b{color:#000}
.L{background:#f0d9b5}.D{background:#b58863}
.m:before,.s:before,.k:before{content:"";position:absolute;inset:0}
.m:before{background:#f6e05a80}.s:before{background:#1e7a3c99}.k:before{background:radial-gradient(#ff2020,#ff202000 72%)}
.t:after,.x:after{content:"";position:absolute;z-index:2;border-radius:50%}
.t:after{inset:36%;background:#0004}.x:after{inset:4%;border:4px solid #0004}
#st.a{color:var(--tg-theme-button-color);font-weight:600}#st.e{color:var(--tg-theme-destructive-text-color)}
button{padding:7px 11px;border:0;border-radius:10px;font:600 14px system-ui;background:var(--tg-theme-secondary-bg-color);color:var(--tg-theme-text-color)}
#rm{background:var(--tg-theme-button-color);color:var(--tg-theme-button-text-color)}
.x0{display:none}
</style>
<div id="h"><b id="op">♟ Шахматы</b><span id="n"></span></div>
<div id="bd"></div>
<div id="ft"><span id="st"></span><button id="dr" class="x0"></button><button id="rg" class="x0">🏳</button><button id="rm" class="x0"></button></div>
<script>
const T=window.TelegramWidget||0,$=i=>document.getElementById(i),A='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789+/',
F='♚♛♜♝♞♟',W='♔♕♖♗♘♙',K='kqrbnp',V='︎',bd=$('bd'),
E={NOT_ALLOWED:'Тут ходить нельзя',BUSY:'Секунду…',RATE_LIMITED:'Слишком быстро',TIMEOUT:'Бот не ответил',FAILED:'Нет связи с ботом',INVALID_ANSWER:'Бот ответил непонятно'},
J=s=>{try{return JSON.parse(s)||{}}catch(e){return{}}},
hp=(k,v)=>{try{T.HapticFeedback[k](v)}catch(e){}},
ix=c=>A.indexOf(c),
brd=f=>{let b=[],r=7,c=0;for(const h of f||'')h=='/'?(r--,c=0):h>'0'&&h<'9'?c+=+h:b[r*8+c++]=h;return b},
pos=v=>{let fl=S.c=='b',r=fl?v>>3:7-(v>>3),c=fl?7-(v&7):v&7;return r*8+c};
let S=J(T.chatData),sel=-1,busy=0,ob=0,fm='',fe=0,tm,rs=0,mv0=S.m;
function tg(){let t={},l=S.l||'';if(sel>=0)for(let i=0;i<l.length;i+=2)if(ix(l[i])==sel)t[ix(l[i+1])]=1;return t}
function fl(m,ok){fm=m;fe=!ok;clearTimeout(tm);tm=setTimeout(()=>{fm='';draw()},2600);if(!ok)hp('notificationOccurred','error');draw()}
function draw(){
let s=S,b=ob||brd(s.f),t=tg(),h='',k,i,p,on=!s.e&&s.o&&!busy;
for(let v=0;v<64;v++){i=pos(v);p=b[i];k=((i>>3)+(i&7))&1?'L':'D';
if(s.m&&(ix(s.m[0])==i||ix(s.m[1])==i))k+=' m';if(i==sel)k+=' s';if(s.k&&ix(s.k)==i)k+=' k';if(t[i])k+=p?' x':' t';
h+='<i class="'+k+'">'+(p?p<'a'?'<u>'+F[K.indexOf(p.toLowerCase())]+V+'</u><b>'+W[K.indexOf(p.toLowerCase())]+V+'</b>':'<b>'+F[K.indexOf(p)]+V+'</b>':'')+'</i>'}
bd.innerHTML=h;bd.style.fontSize=bd.clientWidth/8*.8+'px';
$('op').textContent=s.o?'Ты '+(s.c=='b'?'⚫':'⚪')+' · соперник: '+s.o:'♟ Шахматы Пиздюка';
$('n').textContent=s.n>1?'ход '+s.n:'';
k=$('st');k.textContent=busy?'…':fm||s.s||'';k.className=fm?fe?'e':'':!s.e&&s.t==s.c&&s.o?'a':'';
k=$('dr');k.className=on?'':'x0';k.textContent=s.d==1?'🤝 Согласен':s.d==2?'🤝 Ждём':'🤝';
k=$('rg');k.className=on?'':'x0';k.textContent=rs?'🏳 Точно?':'🏳';
k=$('rm');k.className=s.e&&s.o&&s.g?'':'x0';k.textContent=s.r==1?'🔁 Принять реванш':s.r==2?'🔁 Ждём':'🔁 Реванш'}
function req(d){if(busy)return fl(E.BUSY);let r;try{r=T.request(d+'')}catch(e){r=Promise.reject(e)}
hp('impactOccurred','light');busy=1;draw();
r.then(a=>{let j=J(a&&a.result);if(j.err)throw{code:j.err};if(j.s)S=j.s;busy=0;ob=0;sel=-1;draw()}).catch(e=>{busy=0;ob=0;fl(E[e.code]||e.code||E.FAILED)})}
bd.addEventListener('click',e=>{let c=e.target.closest('i'),s=S;if(!c||!T||busy)return;
let i=pos([...bd.children].indexOf(c)),b=brd(s.f),p=b[i];
if(s.e)return fl('Партия окончена',1);if(!s.o)return fl('Ждём соперника',1);if(s.t!=s.c)return fl('Сейчас ходит '+s.o,1);
if(tg()[i]){b[i]=b[sel];b[sel]=0;ob=b;let a=sel;sel=-1;return req('m:'+s.g+':'+A[a]+A[i])}
if(p&&(p<'a')==(s.c=='w')){sel=sel==i?-1:i;hp('selectionChanged')}else if(sel>=0)sel=-1;else return fl('Это не твоя фигура');draw()});
$('rg').onclick=()=>{if(!rs){rs=1;draw();setTimeout(()=>{rs=0;draw()},3e3)}else{rs=0;req('r:'+S.g)}};
$('dr').onclick=()=>S.d!=2&&req('d:'+S.g);
$('rm').onclick=()=>S.r!=2&&req('n:'+S.g);
if(T){T.onEvent('chatDataChanged',()=>{S=J(T.chatData);fm='';if(S.m!=mv0){sel=-1;mv0=S.m;if(S.t==S.c&&!S.e)hp('notificationOccurred','success')}draw()})}
addEventListener('resize',draw);draw();T.ready&&T.ready();
</script>
